# Parity stack: echo main's Postgres, Directus and Valkey, isolated from every other local
# stack by project name and ports, so the Python API and the Bun API can be compared
# against identical databases. Secrets come from .env.parity (written by bootstrap.sh).
name: parity

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: dembrane
      POSTGRES_PASSWORD: dembrane
      POSTGRES_DB: dembrane
    # fsync off: the stack is disposable and resets run many times per test session.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports: ["127.0.0.1:5440:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dembrane -d dembrane"]
      interval: 1s
      retries: 60

  valkey:
    image: valkey/valkey:8.0.6-alpine
    ports: ["127.0.0.1:6395:6379"]

  directus:
    # Same Dockerfile and Directus version (11.13.4) as echo main's devcontainer, from the
    # main checkout in OLD_ECHO_DIR (parity/old-echo.sh).
    build:
      context: ${OLD_ECHO_DIR:-${HOME}/orca/workspaces/echo-parity-main}/echo/directus
      dockerfile: Dockerfile
    image: parity-directus:11.13.4
    ports: ["127.0.0.1:8065:8055"]
    environment:
      PUBLIC_URL: http://localhost:8065
      PORT: "8055"
      SECRET: ${DIRECTUS_SECRET:?run bootstrap.sh}
      TELEMETRY: "false"
      ADMIN_EMAIL: ${PARITY_ADMIN_EMAIL:?run bootstrap.sh}
      ADMIN_PASSWORD: ${PARITY_ADMIN_PASSWORD:?run bootstrap.sh}
      ADMIN_TOKEN: ${DIRECTUS_TOKEN:?run bootstrap.sh}
      DB_CLIENT: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: dembrane
      DB_PASSWORD: dembrane
      DB_DATABASE: dembrane
      DB_EXCLUDE_TABLES: lightrag_chunk_graph_map,lightrag_doc_chunks,lightrag_doc_full,lightrag_doc_status,lightrag_llm_cache,lightrag_vdb_entity,lightrag_vdb_relation,lightrag_vdb_transcript
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      CORS_CREDENTIALS: "true"
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: lax
      USER_INVITE_URL_ALLOW_LIST: http://localhost:5173/invite
      USER_REGISTER_URL_ALLOW_LIST: http://localhost:5173/verify-email
      PASSWORD_RESET_URL_ALLOW_LIST: http://localhost:5173/password-reset
      STORAGE_LOCATIONS: local
      # Scenarios log in many times in a row.
      RATE_LIMITER_ENABLED: "false"
      # A push to an empty database sends the whole snapshot in one /schema/apply request,
      # well past the 1mb default.
      MAX_PAYLOAD_SIZE: 100mb
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/ping >/dev/null"]
      interval: 2s
      retries: 90

volumes:
  db:
