# Dev service manager — replaces the terminal-keeper sessions.json for non-VS-Code editors.
# Infra (redis/postgres/directus/agent) runs via .devcontainer/docker-compose.yml; these are the host processes.
#
# Run:  mprocs          (opens the TUI with all services)
# Keys: j/k select · s start · x stop · r restart · a (or X) stop-all · q quit
# Tip:  mprocs --names server,workers   to launch a subset

procs:
  server:
    # `exec` replaces `sh` (dash), which is swalling stop signals;
    # otherwise stop signals from `mprocs` orphan processes on quit or restart.
    shell: "exec uv run uvicorn dembrane.main:app --host 0.0.0.0 --port 8000 --reload --loop asyncio"
    cwd: server

  workers:
    shell: "exec uv run dramatiq-gevent --queues network --processes 1 --threads 10 dembrane.tasks"
    cwd: server
    env:
      # Each dramatiq process tries to serve metrics on 9191 by default. Even
      # though we don't collect metrics here, since workers don't have their
      # own container, we increment ports so they don't collide & error.
      dramatiq_prom_port: "9191"

  workers-cpu:
    shell: "exec uv run dramatiq --queues cpu --processes 1 --threads 1 dembrane.tasks"
    cwd: server
    env:
      dramatiq_prom_port: "9192"

  workers-ticks:
    shell: "exec uv run dramatiq --queues ticks --processes 1 --threads 4 dembrane.tasks"
    cwd: server
    env:
      dramatiq_prom_port: "9193"

  scheduler:
    shell: "exec uv run python -m dembrane.scheduler"
    cwd: server

  admin-dashboard:
    shell: "exec pnpm run dev"
    cwd: frontend

  participant-portal:
    shell: "exec pnpm run participant:dev"
    cwd: frontend
