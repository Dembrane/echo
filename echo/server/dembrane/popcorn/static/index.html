<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>popcorn — live session slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=69">
</head>
<body>
<header class="topbar">
  <div class="session-id">
    <span class="session-title" id="session-title">popcorn</span>
    <span class="session-meta" id="session-meta"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="slides"></nav>
</header>

<main id="stage" class="stage" tabindex="-1"></main>

<footer class="colophon">
  <span class="colophon-left">
    <span id="progress-note" class="progress-note"></span>
    <button id="reset-data" class="reset-data" hidden>load demo data</button>
  </span>
  <span id="pop-disclaimer" class="pop-disclaimer" hidden>popcorn is optimised for latency, not accuracy. popcorns in “quotes” are the room's words, word for word; the rest paraphrase what was said.</span>
  <span class="made-with">made with <span class="wordmark">dembrane</span></span>
</footer>

<script src="assets/planar.js?v=1"></script>
<script src="assets/app.js?v=76"></script>
</body>
</html>
