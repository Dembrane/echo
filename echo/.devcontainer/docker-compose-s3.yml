services:
  minio:
    # minio/minio is no longer published. SILO is a community fork that takes
    # the same env vars and ports; its server binary is `silo`.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    ports:
      - 9000:9000
      - 9001:9001
    # Start the server first, then create the buckets once it answers: dembrane
    # for the app, celld for docker-compose-celld.yml's fleet state.
    entrypoint: >
      /bin/sh -c "
      silo server /mnt/data --console-address :9001 &
      until mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/dembrane;
      mc anonymous set download local/dembrane;
      mc mb --ignore-existing local/celld;
      wait"
    environment:
      - MINIO_ROOT_USER=dembrane
      - MINIO_ROOT_PASSWORD=dembrane
      - MINIO_VOLUMES=/mnt/data
    volumes:
      - ./minio_data:/mnt/data
    restart: unless-stopped
    # The base services are all on this network. Without it minio would get its
    # own, and http://minio:9000 would not resolve from the devcontainer.
    networks:
      - dembrane-network
