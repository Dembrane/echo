<!doctype html>
<html lang="en">
  <head>
    <!-- <script src="https://unpkg.com/react-scan/dist/auto.global.js"></script> -->
    <script type="module">
      if (import.meta.env.DEV) {
        import("react-grab");
      }
    </script>
    <meta charset="UTF-8" />
    <!-- The logomark; its parchment cut when the system is dark (browser chrome follows the system, not the app) -->
    <link rel="icon" type="image/png" href="/src/assets/dembrane-logo.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/src/assets/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://tally.so/widgets/embed.js"></script>
    <title>dembrane</title>
    <!-- The loading sketches (BeautifulLoading): in cache before any page can wait on them -->
    <link rel="preload" href="/loading/mark-anim.png" as="image" type="image/png" />
    <!-- Prevent a flash of the wrong scheme or font: apply both before React mounts.
         The scheme is Mantine's own (mantine-color-scheme-value: light | dark | auto). -->
    <style>
      :root[data-mantine-color-scheme="dark"] { --app-background: #000000; --app-text: #f6f4f1; }
      :root { background: var(--app-background, #f6f4f1); }
    </style>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
          var font = "'DM Sans Variable', sans-serif";
          var style = document.documentElement.style;
          style.setProperty('--app-font-family', font);
          style.setProperty('--app-content-bold-font-family', "'DM Sans Content', " + font);
          document.documentElement.setAttribute('data-theme', 'parchment');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Deployment values, injected by the platform web server; a no-op file in dev. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
