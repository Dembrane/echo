name: platform

# Checks, images and deploys for dembrane/platform (the Bun rewrite) and the frontend it
# serves. Checks and image builds run in parallel; images are built once and pushed, and a
# deploy only migrates, rolls out and verifies.
#
# Each environment is its own GCP project, reached through its own keyless GitHub trust, and
# pushes images to its own registry: a preview identity has no role in next or prod.
#
# PR previews (dembrane-web-previews): adding the "preview" label deploys one (echo-pr-<n>-*,
# database echo_pr_<n>, dashboard-<n>, portal-<n> and api-<n>.preview.dembrane.com), each push
# to a labelled PR redeploys it, and removing the label, closing or merging removes it. Every
# deploy seeds the preview admin, the Millbrook sample and the accounts demo. At most three
# exist; a fourth tears down the oldest. One comment on the PR carries the links.
#
# next (dembrane-web-next) deploys main: by hand, and on every push to main once the
# repository variable NEXT_DEPLOY_ON_MAIN is "true". Each deploy lists the PRs it carried in
# #team-engineering and on each PR.
#
# prod (dembrane-web-prod) deploys a release tag vX.Y.Z on main, after the prod environment's
# approval: by hand with the tag, and on pushing the tag once PROD_DEPLOY_ON_TAG is "true".
# A deploy publishes the GitHub Release, tells #team-engineering and each PR, and sends
# release.published to sam, which drafts the in-app release notes for review.
#
# Only failures reach Slack (#alerts-ci). Checks on PRs without a preview stay in the PR.
#
# Caches: pull request runs only restore them. Pushes to main (and runs by hand) check trusted
# code and save them, so code from a PR never writes a cache that another run reads. A PR can
# only read caches saved on its base branch, so until the cutover, when main starts running
# this workflow, PR runs start cold. feat/bun-migration has no push run: its PR checks every
# commit, and a second run would only duplicate every check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    paths: ["dembrane/platform/**", "dembrane/frontend/**", ".github/workflows/platform.yml"]
  push:
    branches: [main]
    # Tag pushes ignore the path filter.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["dembrane/platform/**", "dembrane/frontend/**", ".github/workflows/platform.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy (PR previews come only from the "preview" label on a PR)
        type: choice
        options: [next, prod]
        default: next
      tag:
        description: "prod: the release tag to deploy (vX.Y.Z, on main)"
        type: string
        default: ""
      hold_data:
        description: "Deploy the migrate job without running it and keep the workers at 0 (before the cutover's data move)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event.pull_request.number || inputs.target || github.ref }}
  # A newer push replaces a running check or preview; a next or prod rollout runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dembrane/platform

env:
  REGION: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-previews/echo-preview
  # Pull request runs build the merge commit GitHub prepares (github.sha), the code the checks
  # test; a prod run builds its release tag.
  REF: ${{ inputs.tag || github.sha }}

jobs:
  # Decides what this run does: checks only, a PR preview deploy or teardown, or a next or
  # prod deploy.
  plan:
    name: 00 Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      pr: ${{ steps.plan.outputs.pr }}
      deploy_pr: ${{ steps.plan.outputs.deploy_pr }}
      deploy_env: ${{ steps.plan.outputs.deploy_env }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      teardown: ${{ steps.plan.outputs.teardown }}
    steps:
      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          TARGET: ${{ inputs.target }}
          TAG_INPUT: ${{ inputs.tag }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          EVENT_LABEL: ${{ github.event.label.name }}
          NEXT_ON_MAIN: ${{ vars.NEXT_DEPLOY_ON_MAIN }}
          PROD_ON_TAG: ${{ vars.PROD_DEPLOY_ON_TAG }}
        run: |
          sha=$GITHUB_SHA pr='' deploy_pr=false deploy_env='' release_tag='' teardown=false
          case "$EVENT" in
            workflow_dispatch)
              # The GCP trusts enforce the same refs; failing here says why before any build.
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::$TARGET deploys run from main, not $GITHUB_REF"; exit 1; }
              deploy_env=$TARGET
              if [ "$TARGET" = prod ]; then release_tag=$TAG_INPUT
              elif [ -n "$TAG_INPUT" ]; then echo "::error::A tag is for prod; next deploys main"; exit 1; fi
              ;;
            push)
              case "$GITHUB_REF" in
                refs/tags/*)
                  if [ "$PROD_ON_TAG" = true ]; then deploy_env=prod release_tag=$GITHUB_REF_NAME
                  else echo "::notice::Tag pushes deploy prod once the variable PROD_DEPLOY_ON_TAG is true; checks only"; fi ;;
                refs/heads/main)
                  if [ "$NEXT_ON_MAIN" = true ]; then deploy_env=next
                  else echo "::notice::Pushes to main deploy next once the variable NEXT_DEPLOY_ON_MAIN is true; checks only"; fi ;;
              esac
              ;;
            pull_request)
              pr=$PR_EVENT
              if [ "$ACTION" = closed ]; then teardown=true
              elif [ "$ACTION" = unlabeled ]; then
                if [ "$EVENT_LABEL" = preview ]; then teardown=true; fi
              # Adding some other label to a preview PR is not a reason to redeploy it.
              elif [ "$ACTION" = labeled ] && [ "$EVENT_LABEL" != preview ]; then :
              elif [ "$HAS_LABEL" = true ]; then deploy_pr=true; fi
              ;;
          esac
          if [ "$deploy_env" = prod ]; then
            [[ $release_tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::prod deploys a release tag vX.Y.Z, not '$release_tag'"; exit 1; }
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha) || { echo "::error::No tag $release_tag"; exit 1; }
            case "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)" in
              identical | behind) ;;
              *) echo "::error::$release_tag ($sha) is not on main"; exit 1 ;;
            esac
          fi
          echo "sha=$sha pr=$pr deploy_pr=$deploy_pr deploy_env=$deploy_env release_tag=$release_tag teardown=$teardown"
          {
            echo "sha=$sha"; echo "pr=$pr"; echo "deploy_pr=$deploy_pr"; echo "deploy_env=$deploy_env"
            echo "release_tag=$release_tag"; echo "teardown=$teardown"
          } >> "$GITHUB_OUTPUT"

  check-server:
    name: 10 Check server
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env: { POSTGRES_USER: echo, POSTGRES_PASSWORD: echo, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echo -d postgres" --health-interval 1s --health-retries 60
    env:
      TEST_DATABASE_ADMIN_URL: postgres://echo:echo@localhost:5432/postgres
      SAVE_CACHE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: dembrane/platform/.bun-version
          no-cache: ${{ github.event_name == 'pull_request' }}
      - name: Restore Bun cache
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('dembrane/platform/bun.lock') }}
          restore-keys: bun-
      # The incremental type-check state: a run after a small change re-checks only it.
      - name: Restore type-check cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dembrane/platform/.cache
          key: tsc-${{ github.sha }}
          restore-keys: tsc-
      # The pipeline and media tests run real ffmpeg: the same static build the media image
      # ships, copied out of its image once and cached.
      - name: Restore ffmpeg cache
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-7.1.1
      - name: Download ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          id=$(docker create mwader/static-ffmpeg:7.1.1)
          docker cp "$id:/ffmpeg" ~/ffmpeg/ffmpeg && docker cp "$id:/ffprobe" ~/ffmpeg/ffprobe
          docker rm "$id" >/dev/null
      # Saved before any repository code runs, so the cache holds only the upstream image's files.
      - name: Save ffmpeg cache
        if: env.SAVE_CACHE == 'true' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-7.1.1
      - name: Add ffmpeg to PATH
        run: echo ~/ffmpeg >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Type check
        run: bun run typecheck
      # Config is declared, valid in every environment, and read.
      - name: Check config
        run: bun run config check
      # Packages import down the layers, and README.md's package map is current.
      - name: Check package layers
        run: bun run packages check
      - name: Check schema matches migrations
        working-directory: dembrane/platform/packages/db
        run: bunx drizzle-kit generate < /dev/null | tee /dev/stderr | grep -q "No schema changes"
      # Files in parallel, each database test on its own database.
      - name: Run tests
        run: bun test --parallel
      - name: Save Bun cache
        if: env.SAVE_CACHE == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('dembrane/platform/bun.lock') }}
      - name: Save type-check cache
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dembrane/platform/.cache
          key: tsc-${{ github.sha }}

  check-frontend:
    name: 20 Check frontend
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dembrane/frontend
    env:
      SAVE_CACHE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .tool-versions
      - name: Find pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Vitest's prebundled dependencies and its timing file, which orders slow files first.
      - name: Restore Vitest cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dembrane/frontend/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml', 'dembrane/frontend/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml', 'dembrane/frontend/vite.config.ts') }}-
            vitest-${{ runner.os }}-
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc
      # Every vitest file under src; the Playwright specs in e2e/ are excluded in vite.config.ts.
      - name: Run tests
        run: pnpm exec vitest run
      # Fails when extract or compile changes a catalog, or when a locale lacks a message
      # English has. Fill gaps locally with `pnpm translations:fill` (Gemini EU; entries land
      # in each catalog's machine-translations.json for review) and commit the result.
      - name: Check translations
        run: |
          pnpm messages:extract
          pnpm messages:compile
          node scripts/check-translations.mjs --strict
      # The frontend builds without the platform folder, so it keeps a generated copy of the API types.
      - name: Check API types are in sync
        run: |
          node scripts/sync-accounts-contract.mjs --check
          node scripts/sync-error-codes.mjs --check
      # The participant portal loads on phones at events, so its first download must not grow.
      - name: Check portal bundle size
        run: node scripts/check-portal-bundle.mjs
      - name: Save pnpm cache
        if: env.SAVE_CACHE == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml') }}
      - name: Save Vitest cache
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dembrane/frontend/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml', 'dembrane/frontend/vite.config.ts') }}-${{ github.sha }}

  # Builds the five images to prove they build and start; a deploy job pushes them from the
  # Docker layer cache this writes. A pull request run writes that cache under the PR's own
  # ref, which only that PR's runs can read.
  images:
    name: 40 Build images
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TAG: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build images
        run: scripts/build-images.sh --load --cache-to
      - name: Smoke test containers
        run: |
          # Each binary checks at boot that its image carries the files it reads and exits
          # non-zero naming any that are missing. The worker and migrate job need a database
          # to go further, so they stop after the check.
          docker run --rm "$REGISTRY/worker:$TAG" --check-assets
          docker run --rm "$REGISTRY/migrate:$TAG" --check-assets
          docker run -d --name api -p 8080:8080 -e APP_ENV=test -e DATABASE_URL=postgres://u:p@127.0.0.1:1/d \
            -e AUTH_SECRET=smoke-test-secret-that-is-long-enough-000 -e INVITE_HASH_SECRET=smoke-test-invite-secret-000 \
            "$REGISTRY/api:$TAG"
          docker run -d --name media -p 8081:8080 -e APP_ENV=test "$REGISTRY/media:$TAG"
          ok=
          for _ in $(seq 1 25); do curl -sf localhost:8080/health && ok=1 && break; sleep 0.2; done
          [ -n "$ok" ] || { docker logs api; exit 1; }
          # Asset-backed routes that need no database: popcorn's logo and a drawing read from
          # /app/assets, the same tree the deck page template comes from.
          for f in logo.png illustrations/scan.webp; do
            curl -sf "localhost:8080/api/v2/popcorn/public/smoke/$f" -o /dev/null || { docker logs api; exit 1; }
          done
          # The media image must ship the ffmpeg it runs, not only answer HTTP.
          for _ in $(seq 1 25); do curl -sf localhost:8081/health && break; sleep 0.2; done
          curl -sf -X POST localhost:8081/probe-url -H 'content-type: application/json' -d '{"url":"http://127.0.0.1:9/x.mp3"}' -o /dev/null -w '%{http_code}' | grep -q 422 \
            || { docker logs media; exit 1; }

  # A PR preview: its own services and database, built from the PR. Serialized across PRs so
  # two new previews cannot both take the last slot. It runs when a check failed too, only to
  # say so in the PR comment.
  deploy-pr:
    name: 50 Deploy PR preview
    if: ${{ !cancelled() && needs.plan.outputs.deploy_pr == 'true' }}
    needs: [plan, check-server, check-frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pr-preview
    concurrency:
      group: preview-slots
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      PR: ${{ needs.plan.outputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Stop when a check failed
        id: gate
        env:
          RESULTS: |
            10 Check server=${{ needs.check-server.result }}
            20 Check frontend=${{ needs.check-frontend.result }}
            40 Build images=${{ needs.images.result }}
        run: |
          failed=$(awk -F= '$2 != "success" { printf "%s%s", (n++ ? ", " : ""), $1 }' <<<"$RESULTS")
          [ -z "$failed" ] && exit 0
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "::error::Not deploying: $failed did not pass"
          exit 1
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { skip_install: true }
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The images job built these moments ago; its layer cache makes this a push.
      - name: Push images
        id: push
        run: scripts/build-images.sh --push
      - name: Make room (at most 3 previews)
        id: room
        run: |
          before=$(scripts/deploy-env.sh list | awk '{ print $1 }')
          scripts/deploy-env.sh make-room "$PR"
          after=$(scripts/deploy-env.sh list | awk '{ print $1 }')
          for n in $before; do
            grep -qx "$n" <<<"$after" || scripts/ci-notify.sh preview removed "$n" "to make room for #$PR" || true
          done
      - name: Deploy and verify
        id: deploy
        run: |
          out=$(scripts/deploy-env.sh deploy "pr-$PR" "$TAG" | tail -n 1)
          echo "$out"
          echo "Preview for #$PR: ${out// /  }" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          CHECKS_FAILED: ${{ steps.gate.outputs.failed }}
          OUTCOMES: |
            gate=${{ steps.gate.outcome }}
            Authenticate to Google Cloud=${{ steps.auth.outcome }}
            Push images=${{ steps.push.outcome }}
            Make room=${{ steps.room.outcome }}
            Deploy and verify=${{ steps.deploy.outcome }}
        run: |
          failed=$(awk -F= '$2 == "failure" { print $1; exit }' <<<"$OUTCOMES")
          [ "$failed" = gate ] && failed="$CHECKS_FAILED (nothing was deployed)"
          if [ -n "$failed" ]; then scripts/ci-notify.sh preview failed "$PR" "$failed"
          else scripts/ci-notify.sh preview deployed "$PR"; fi

  teardown-pr:
    name: 51 Tear down PR preview
    if: needs.plan.outputs.teardown == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-preview
    concurrency:
      group: preview-slots
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR: ${{ needs.plan.outputs.pr }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            dembrane/platform/scripts
            dembrane/platform/infra
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { skip_install: true }
      - name: Tear down preview
        run: scripts/deploy-env.sh teardown "$PR"
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ github.event.action == 'closed' && 'the PR was closed' || 'the preview label was removed' }}
        run: scripts/ci-notify.sh preview removed "$PR" "$WHY"

  # next and prod: each pushes the images into its own project's registry (the layer cache
  # makes that an upload) and deploys with its own identity.
  deploy-next:
    name: 60 Deploy next
    if: needs.plan.outputs.deploy_env == 'next'
    needs: [plan, check-server, check-frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Records each deploy as a GitHub Deployment: the last successful one is where the next
    # deploy's list of PRs starts.
    environment: next
    concurrency:
      group: deploy-next
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      id-token: write
      pull-requests: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-next/echo-next
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/488580804029/locations/global/workloadIdentityPools/echo-next-github/providers/github
          service_account: echo-next-deployer@dembrane-web-next.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { skip_install: true }
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Push images
        run: scripts/build-images.sh --push
      - name: Deploy and verify
        env:
          HOLD_DATA: ${{ inputs.hold_data && '1' || '0' }}
        run: scripts/deploy-env.sh deploy next "$TAG"
      # The deploy stands even when a message fails to send.
      - name: Announce deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_TOKEN: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
        run: scripts/release.sh announce-next "$TAG"

  deploy-prod:
    name: 70 Deploy prod
    if: needs.plan.outputs.deploy_env == 'prod'
    needs: [plan, check-server, check-frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The prod trust accepts only jobs in this environment; its required reviewers approve
    # each deploy before the job gets a token.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-prod/echo-prod
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.REF }}", persist-credentials: false }
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/740075346439/locations/global/workloadIdentityPools/echo-prod-github/providers/github
          service_account: echo-prod-deployer@dembrane-web-prod.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with: { skip_install: true }
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Push images
        run: scripts/build-images.sh --push
      - name: Deploy and verify
        env:
          HOLD_DATA: ${{ inputs.hold_data && '1' || '0' }}
        run: scripts/deploy-env.sh deploy prod "$TAG"
      # The GitHub Release, #team-engineering, a comment on each PR, and release.published to
      # sam (skipped with a notice while its secrets are empty). The deploy stands even when
      # one of these fails.
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_TOKEN: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          SAM_RELEASE_WEBHOOK_URL: ${{ secrets.SAM_RELEASE_WEBHOOK_URL }}
          SAM_RELEASE_WEBHOOK_SECRET: ${{ secrets.SAM_RELEASE_WEBHOOK_SECRET }}
        run: scripts/release.sh publish-release "$RELEASE_TAG"

  # Any failed job posts to #alerts-ci, naming the job and the step, except checks on a PR
  # without a preview (they stay in the PR).
  notify-failure:
    name: 90 Notify on failure
    if: >-
      failure()
      && (github.event_name != 'pull_request' || needs.plan.outputs.deploy_pr == 'true' || needs.plan.outputs.teardown == 'true')
    needs: [plan, check-server, check-frontend, images, deploy-pr, teardown-pr, deploy-next, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: dembrane/platform/scripts
      - name: Post to #alerts-ci
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_TOKEN: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          WHAT: "${{ (needs.plan.outputs.deploy_env && format('{0} deploy', needs.plan.outputs.deploy_env)) || (needs.plan.outputs.pr && format('PR #{0} preview', needs.plan.outputs.pr)) || 'platform checks' }}"
          SHA: ${{ needs.plan.outputs.sha || github.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-notify.sh failure
