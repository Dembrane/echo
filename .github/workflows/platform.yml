name: platform

# Checks, images and deploys for dembrane/platform (the Bun rewrite) and the frontend it
# serves. Checks and image builds run in parallel; images are built once and pushed, and a
# deploy only migrates, rolls out and verifies.
#
# Each environment is its own GCP project, reached through its own keyless GitHub trust, and
# pushes images to its own registry: a preview identity has no role in next or prod.
#
# Previews (dembrane-web-previews): the branch preview (echo-preview-*) follows
# feat/bun-migration until cutover. A PR gets its own preview (echo-pr-<n>-*, database
# echo_pr_<n>) only on request: the "preview" label, or running this workflow by hand with
# target pr and the PR number. At most three PR previews exist; a fourth tears down the
# oldest. Closing or merging a PR removes its preview.
#
# next (dembrane-web-next) and prod (dembrane-web-prod) deploy only when run by hand until
# cutover: next from main, prod from main or a tag and after the prod environment's approval.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
    paths: ["dembrane/platform/**", "dembrane/frontend/**", ".github/workflows/platform.yml"]
  push:
    branches: [feat/bun-migration]
    paths: ["dembrane/platform/**", "dembrane/frontend/**", ".github/workflows/platform.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [pr, next, prod]
        default: pr
      pr:
        description: PR number to deploy a preview for (target pr)
        required: false
        type: number
      hold_data:
        description: "next or prod: deploy the migrate job without running it and keep the workers at 0 (before the cutover's data move)"
        type: boolean
        default: true

concurrency:
  group: platform-${{ github.event.pull_request.number || (inputs.target == 'pr' && inputs.pr) || inputs.target || github.ref }}
  # A newer push replaces a running check or preview; a next or prod rollout runs to the end.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'pr' }}

defaults:
  run:
    working-directory: dembrane/platform

env:
  REGION: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-previews/echo-preview
  TAG: ${{ github.sha }}
  # Push images only for the branch that deploys; PRs build them to prove they build.
  PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration' }}

jobs:
  # Decides what this run does: checks only, a branch preview deploy, a PR preview deploy,
  # a PR preview teardown, or a next or prod deploy.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      pr: ${{ steps.plan.outputs.pr }}
      deploy_pr: ${{ steps.plan.outputs.deploy_pr }}
      deploy_env: ${{ steps.plan.outputs.deploy_env }}
      teardown: ${{ steps.plan.outputs.teardown }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          TARGET: ${{ inputs.target }}
          PR_INPUT: ${{ inputs.pr }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          ADDED_LABEL: ${{ github.event.label.name }}
        run: |
          sha=$GITHUB_SHA pr='' deploy_pr=false deploy_env='' teardown=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$TARGET" != pr ]; then
            # The GCP trust enforces the same refs; failing here says why before any build.
            case "$TARGET:$GITHUB_REF" in
              next:refs/heads/main | prod:refs/heads/main | prod:refs/tags/*) deploy_env=$TARGET ;;
              *) echo "$TARGET does not deploy from $GITHUB_REF (next: main; prod: main or a tag)"; exit 1 ;;
            esac
          elif [ "$EVENT" = workflow_dispatch ]; then
            pr=$PR_INPUT
            [ -n "$pr" ] || { echo "target pr needs a PR number"; exit 1; }
            read -r state sha < <(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,headRefOid -q '.state + " " + .headRefOid')
            [ "$state" = OPEN ] || { echo "PR $pr is $state; previews are for open PRs"; exit 1; }
            deploy_pr=true
          elif [ "$EVENT" = pull_request ]; then
            pr=$PR_EVENT sha=$PR_SHA
            if [ "$ACTION" = closed ]; then teardown=true
            # Adding some other label to a preview PR is not a reason to redeploy it.
            elif [ "$ACTION" = labeled ] && [ "$ADDED_LABEL" != preview ]; then :
            elif [ "$HAS_LABEL" = true ]; then deploy_pr=true; fi
          fi
          echo "sha=$sha pr=$pr deploy_pr=$deploy_pr deploy_env=$deploy_env teardown=$teardown"
          { echo "sha=$sha"; echo "pr=$pr"; echo "deploy_pr=$deploy_pr"; echo "deploy_env=$deploy_env"; echo "teardown=$teardown"; } >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env: { POSTGRES_USER: echo, POSTGRES_PASSWORD: echo, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echo -d postgres" --health-interval 1s --health-retries 60
    env:
      TEST_DATABASE_ADMIN_URL: postgres://echo:echo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: dembrane/platform/.bun-version }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('dembrane/platform/bun.lock') }}
          restore-keys: bun-
      # The incremental type-check state: a run after a small change re-checks only it.
      - uses: actions/cache@v4
        with:
          path: dembrane/platform/.cache
          key: tsc-${{ github.sha }}
          restore-keys: tsc-
      # The pipeline and media tests run real ffmpeg: the same static build the media image
      # ships, copied out of its image once and cached.
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-7.1.1
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        name: ffmpeg
        run: |
          mkdir -p ~/ffmpeg
          id=$(docker create mwader/static-ffmpeg:7.1.1)
          docker cp $id:/ffmpeg ~/ffmpeg/ffmpeg && docker cp $id:/ffprobe ~/ffmpeg/ffprobe
          docker rm $id >/dev/null
      - run: echo ~/ffmpeg >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Types
        run: bun run typecheck
      - name: Config is declared, valid in every environment, and read
        run: bun run config check
      - name: Packages import down the layers, and README.md's package map is current
        run: bun run packages check
      - name: Schema and migrations agree
        working-directory: dembrane/platform/packages/db
        run: bunx drizzle-kit generate < /dev/null | tee /dev/stderr | grep -q "No schema changes"
      - name: Tests (files in parallel, each database test on its own database)
        run: bun test --parallel

  frontend:
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dembrane/frontend
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: dembrane/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Vitest's prebundled dependencies and its timing file, which orders slow files first.
      - uses: actions/cache@v4
        with:
          path: dembrane/frontend/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml', 'dembrane/frontend/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('dembrane/frontend/pnpm-lock.yaml', 'dembrane/frontend/vite.config.ts') }}-
            vitest-${{ runner.os }}-
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm exec tsc
      # Every vitest file under src; the Playwright specs in e2e/ are excluded in vite.config.ts.
      - name: Tests
        run: pnpm exec vitest run
      # Fails when extract or compile changes a catalog, or when a locale lacks a message
      # English has. Fill gaps locally with `pnpm translations:fill` (Gemini EU; entries land
      # in each catalog's machine-translations.json for review) and commit the result.
      - name: Translations
        run: |
          pnpm messages:extract
          pnpm messages:compile
          node scripts/check-translations.mjs --strict
      # The frontend builds against copies of the platform's API contract and error codes.
      - name: Contract
        run: |
          node scripts/sync-accounts-contract.mjs --check
          node scripts/sync-error-codes.mjs --check
      # The participant portal's first load must not grow: builds and compares with the
      # baseline recorded in the script.
      - name: Portal size
        run: node scripts/check-portal-bundle.mjs

  images:
    needs: plan
    if: needs.plan.outputs.teardown != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - if: env.PUSH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      - if: env.PUSH == 'true'
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build (and on the deploy branch, push) the five images
        run: scripts/build-images.sh "$([ "$PUSH" = true ] && echo --push || echo --load)" --cache-to
      - name: The API, worker, migrate and media containers start and answer
        if: env.PUSH != 'true'
        run: |
          # Each binary checks at boot that its image carries the files it reads and exits
          # non-zero naming any that are missing. The worker and migrate job need a database
          # to go further, so they stop after the check.
          docker run --rm $REGISTRY/worker:$TAG --check-assets
          docker run --rm $REGISTRY/migrate:$TAG --check-assets
          docker run -d --name api -p 8080:8080 -e APP_ENV=test -e DATABASE_URL=postgres://u:p@127.0.0.1:1/d \
            -e AUTH_SECRET=smoke-test-secret-that-is-long-enough-000 -e INVITE_HASH_SECRET=smoke-test-invite-secret-000 \
            $REGISTRY/api:$TAG
          docker run -d --name media -p 8081:8080 -e APP_ENV=test $REGISTRY/media:$TAG
          ok=
          for i in $(seq 1 25); do curl -sf localhost:8080/health && ok=1 && break; sleep 0.2; done
          [ -n "$ok" ] || { docker logs api; exit 1; }
          # Asset-backed routes that need no database: popcorn's logo and a drawing read from
          # /app/assets, the same tree the deck page template comes from.
          for f in logo.png illustrations/scan.webp; do
            curl -sf localhost:8080/api/v2/popcorn/public/smoke/$f -o /dev/null || { docker logs api; exit 1; }
          done
          # The media image must ship the ffmpeg it runs, not only answer HTTP.
          for i in $(seq 1 25); do curl -sf localhost:8081/health && break; sleep 0.2; done
          curl -sf -X POST localhost:8081/probe-url -H 'content-type: application/json' -d '{"url":"http://127.0.0.1:9/x.mp3"}' -o /dev/null -w '%{http_code}' | grep -q 422 \
            || { docker logs media; exit 1; }

  deploy-preview:
    # Migrations run as a job first; a failure stops the rollout before new code takes traffic.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration'
    needs: [plan, check, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            dembrane/platform/scripts
            dembrane/platform/infra
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      # The runner ships gcloud; installing it again cost half a minute.
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - name: Migrate, deploy media, API, worker, dashboard and portal, and verify
        run: scripts/deploy-env.sh deploy preview "$TAG"

  # A PR preview: its own services and database, built from the PR's head. Serialized
  # across PRs so two new previews cannot both take the last slot.
  deploy-pr:
    if: needs.plan.outputs.deploy_pr == 'true'
    needs: [plan, check, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pr-preview
    concurrency:
      group: preview-slots
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      PR: ${{ needs.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      # The images job built these moments ago; its layer cache makes this a push.
      - name: Push the five images
        run: scripts/build-images.sh --push
      - name: Make room (at most three PR previews)
        run: scripts/deploy-env.sh make-room "$PR"
      - name: Deploy and verify
        run: |
          out=$(scripts/deploy-env.sh deploy "pr-$PR" "$TAG" | tail -n 1)
          echo "$out"
          echo "Preview for #$PR: ${out// /  }" >> "$GITHUB_STEP_SUMMARY"

  teardown-pr:
    if: needs.plan.outputs.teardown == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-preview
    concurrency:
      group: preview-slots
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            dembrane/platform/scripts
            dembrane/platform/infra
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/218237812097/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-web-previews.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - name: Remove the preview's services and drop its database
        run: scripts/deploy-env.sh teardown "${{ needs.plan.outputs.pr }}"

  # next and prod: each pushes the images into its own project's registry (the layer cache
  # makes that an upload) and deploys with its own identity. Run by hand until cutover.
  deploy-next:
    if: needs.plan.outputs.deploy_env == 'next'
    needs: [plan, check, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-next
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-next/echo-next
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/488580804029/locations/global/workloadIdentityPools/echo-next-github/providers/github
          service_account: echo-next-deployer@dembrane-web-next.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Push the five images
        run: scripts/build-images.sh --push
      - name: Migrate, deploy media, API, worker, dashboard and portal, and verify
        env:
          HOLD_DATA: ${{ inputs.hold_data && '1' || '0' }}
        run: scripts/deploy-env.sh deploy next "$TAG"

  deploy-prod:
    if: needs.plan.outputs.deploy_env == 'prod'
    needs: [plan, check, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The prod trust accepts only jobs in this environment; its required reviewers approve
    # each deploy before the job gets a token.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.sha }}
      REGISTRY: europe-west4-docker.pkg.dev/dembrane-web-prod/echo-prod
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.plan.outputs.sha }}" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/740075346439/locations/global/workloadIdentityPools/echo-prod-github/providers/github
          service_account: echo-prod-deployer@dembrane-web-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Push the five images
        run: scripts/build-images.sh --push
      - name: Migrate, deploy media, API, worker, dashboard and portal, and verify
        env:
          HOLD_DATA: ${{ inputs.hold_data && '1' || '0' }}
        run: scripts/deploy-env.sh deploy prod "$TAG"

  # A failed deploy (branch preview, PR preview, next, prod) or a failed build or check on
  # the way to one posts to #alerts-ci. Checks on PRs without a preview stay in the PR.
  notify-failure:
    if: failure() && (github.event_name != 'pull_request' || needs.plan.outputs.deploy_pr == 'true' || needs.plan.outputs.teardown == 'true')
    needs: [plan, check, frontend, images, deploy-preview, deploy-pr, teardown-pr, deploy-next, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Post to #alerts-ci
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          WHAT: "${{ needs.plan.outputs.deploy_env || (needs.plan.outputs.pr && format('PR #{0} preview', needs.plan.outputs.pr)) || 'branch preview' }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.plan.outputs.sha || github.sha }}
        run: |
          jq -n --arg c C0C4HBZNSNT --arg t ":x: *platform* · $WHAT failed on \`${GITHUB_REF_NAME}\` (${SHA:0:7}) · <$RUN|run>" \
            '{channel: $c, text: $t, unfurl_links: false}' |
            curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" -H 'content-type: application/json; charset=utf-8' --data @- |
            jq -e .ok >/dev/null
