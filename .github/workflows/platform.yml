name: platform

# Checks, images and the preview deploy for echo/platform (the Bun rewrite) and the
# frontend it serves. Checks and image builds run in parallel; images are built once and
# pushed, and the deploy only migrates, rolls out and verifies.
on:
  pull_request:
    paths: ["echo/platform/**", "echo/frontend/**", ".github/workflows/platform.yml"]
  push:
    branches: [feat/bun-migration]
    paths: ["echo/platform/**", "echo/frontend/**", ".github/workflows/platform.yml"]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: echo/platform

env:
  PROJECT: dembrane-echo
  REGION: europe-west4
  REGISTRY: europe-west4-docker.pkg.dev/dembrane-echo/echo-preview
  TAG: ${{ github.sha }}
  # Push images only for the branch that deploys; PRs build them to prove they build.
  PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env: { POSTGRES_USER: echo, POSTGRES_PASSWORD: echo, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echo" --health-interval 1s --health-retries 60
    env:
      TEST_DATABASE_ADMIN_URL: postgres://echo:echo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: echo/platform/.bun-version }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('echo/platform/bun.lock') }}
          restore-keys: bun-
      # The incremental type-check state: a run after a small change re-checks only it.
      - uses: actions/cache@v4
        with:
          path: echo/platform/.cache
          key: tsc-${{ github.sha }}
          restore-keys: tsc-
      # The pipeline and media tests run real ffmpeg: the same static build the media image
      # ships, copied out of its image once and cached.
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-7.1.1
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        name: ffmpeg
        run: |
          mkdir -p ~/ffmpeg
          id=$(docker create mwader/static-ffmpeg:7.1.1)
          docker cp $id:/ffmpeg ~/ffmpeg/ffmpeg && docker cp $id:/ffprobe ~/ffmpeg/ffprobe
          docker rm $id >/dev/null
      - run: echo ~/ffmpeg >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Types
        run: bun run typecheck
      - name: Config is declared, valid in every environment, and read
        run: bun run config check
      - name: Schema and migrations agree
        working-directory: echo/platform/packages/db
        run: bunx drizzle-kit generate < /dev/null | tee /dev/stderr | grep -q "No schema changes"
      - name: Tests (files in parallel, each database test on its own database)
        run: bun test --parallel

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: echo/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: echo/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm exec tsc
      # The accounts screens build against a copy of platform/packages/accounts' contract.
      - name: Accounts contract matches the platform
        run: node scripts/sync-accounts-contract.mjs --check
      - name: Accounts tests
        run: pnpm exec vitest run src/features/accounts src/components/auth/utils
      # The participant portal's first load must not grow: builds and compares with the
      # baseline recorded in the script.
      - name: Portal first-load size
        run: node scripts/check-portal-bundle.mjs

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - if: env.PUSH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/86405194907/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-echo.iam.gserviceaccount.com
      - if: env.PUSH == 'true'
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build (and on the deploy branch, push) the five images
        run: |
          out=$([ "$PUSH" = true ] && echo --push || echo --load)
          build() {
            docker buildx build $out --provenance=false \
              --cache-from type=gha,scope=$1 --cache-to type=gha,mode=max,scope=$1 \
              -f apps/$1/Dockerfile --build-arg RELEASE=$TAG -t $REGISTRY/$1:$TAG "${@:2}"
          }
          # The API and worker also take the repository's docs/ (MCP knowledge, chat assistant).
          build api . --build-context docs=../../docs & build worker . --build-context docs=../../docs &
          build migrate . &
          build media . & build web .. &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done; exit $fail
      - name: The API, worker, migrate and media containers start and answer
        if: env.PUSH != 'true'
        run: |
          # Each binary checks at boot that its image carries the files it reads and exits
          # non-zero naming any that are missing. The worker and migrate job need a database
          # to go further, so they stop after the check.
          docker run --rm $REGISTRY/worker:$TAG --check-assets
          docker run --rm $REGISTRY/migrate:$TAG --check-assets
          docker run -d --name api -p 8080:8080 -e APP_ENV=test -e DATABASE_URL=postgres://u:p@127.0.0.1:1/d \
            -e AUTH_SECRET=smoke-test-secret-that-is-long-enough-000 -e INVITE_HASH_SECRET=smoke-test-invite-secret-000 \
            $REGISTRY/api:$TAG
          docker run -d --name media -p 8081:8080 -e APP_ENV=test $REGISTRY/media:$TAG
          ok=
          for i in $(seq 1 25); do curl -sf localhost:8080/health && ok=1 && break; sleep 0.2; done
          [ -n "$ok" ] || { docker logs api; exit 1; }
          # Asset-backed routes that need no database: popcorn's logo and a drawing read from
          # /app/assets, the same tree the deck page template comes from.
          for f in logo.png illustrations/scan.webp; do
            curl -sf localhost:8080/api/v2/popcorn/public/smoke/$f -o /dev/null || { docker logs api; exit 1; }
          done
          # The media image must ship the ffmpeg it runs, not only answer HTTP.
          for i in $(seq 1 25); do curl -sf localhost:8081/health && break; sleep 0.2; done
          curl -sf -X POST localhost:8081/probe-url -H 'content-type: application/json' -d '{"url":"http://127.0.0.1:9/x.mp3"}' -o /dev/null -w '%{http_code}' | grep -q 422 \
            || { docker logs media; exit 1; }

  deploy-preview:
    # Migrations run as a job first; a failure stops the rollout before new code takes traffic.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/bun-migration'
    needs: [check, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: preview
    # No checkout: the deploy only talks to GCP.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      id-token: write
    env:
      SQL: dembrane-echo:europe-west4:echo-preview
      # The media service's deterministic URL (service name, project number, region), known
      # before it is deployed so all services roll out together. Callers use it as the
      # audience of the Google ID token they present.
      MEDIA_URL: https://echo-preview-media-86405194907.europe-west4.run.app
      AUDIO_BUCKET: STORAGE_S3_ENDPOINT=https://storage.googleapis.com,STORAGE_S3_BUCKET=dembrane-echo-echo-preview-uploads
      AUDIO_KEYS: STORAGE_S3_KEY=echo-preview-s3-access-key-id:latest,STORAGE_S3_SECRET=echo-preview-s3-secret-access-key:latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/86405194907/locations/global/workloadIdentityPools/echo-preview-github/providers/github
          service_account: echo-preview-deployer@dembrane-echo.iam.gserviceaccount.com
      # The runner ships gcloud; installing it again cost half a minute.
      - uses: google-github-actions/setup-gcloud@v2
        with: { skip_install: true }
      - name: Migrate
        run: |
          gcloud run jobs deploy echo-preview-migrate --project $PROJECT --region $REGION \
            --image $REGISTRY/migrate:$TAG \
            --service-account echo-preview-migrate@$PROJECT.iam.gserviceaccount.com \
            --set-cloudsql-instances $SQL \
            --set-secrets MIGRATION_DATABASE_URL=echo-preview-migration-database-url:latest \
            --set-env-vars APP_DB_ROLE=echo_app --task-timeout 600 --max-retries 0 \
            --execute-now --wait
      - name: Deploy media, API, worker, dashboard and portal
        run: |
          # Media: public ingress, IAM required. Only the worker and API identities hold
          # run.invoker; they call it with an ID token. One ffmpeg job per instance.
          (
            gcloud run deploy echo-preview-media --project $PROJECT --region $REGION \
              --image $REGISTRY/media:$TAG \
              --service-account echo-preview-media@$PROJECT.iam.gserviceaccount.com \
              --set-env-vars APP_ENV=preview,APP_RELEASE=$TAG \
              --cpu 2 --memory 4Gi --concurrency 1 --min-instances 0 --max-instances 10 \
              --timeout 3600 --ingress all --no-allow-unauthenticated --quiet
            for sa in worker api; do
              gcloud run services add-iam-policy-binding echo-preview-media --project $PROJECT --region $REGION \
                --member serviceAccount:echo-preview-$sa@$PROJECT.iam.gserviceaccount.com \
                --role roles/run.invoker --quiet >/dev/null
            done
          ) &
          gcloud run deploy echo-preview-api --project $PROJECT --region $REGION \
            --image $REGISTRY/api:$TAG \
            --service-account echo-preview-api@$PROJECT.iam.gserviceaccount.com \
            --add-cloudsql-instances $SQL \
            --set-secrets DATABASE_URL=echo-preview-database-url:latest,AUTH_SECRET=echo-preview-auth-secret:latest,INVITE_HASH_SECRET=echo-preview-invite-hash-secret:latest,FILES_S3_ACCESS_KEY_ID=echo-preview-s3-access-key-id:latest,FILES_S3_SECRET_ACCESS_KEY=echo-preview-s3-secret-access-key:latest,$AUDIO_KEYS \
            --set-env-vars APP_ENV=preview,APP_RELEASE=$TAG,FILES_S3_ENDPOINT=https://storage.googleapis.com,FILES_S3_BUCKET=dembrane-echo-echo-preview-uploads,$AUDIO_BUCKET,MEDIA_URL=$MEDIA_URL \
            --cpu 1 --memory 512Mi --concurrency 80 --min-instances 0 --max-instances 4 \
            --timeout 3600 --cpu-boost --allow-unauthenticated --quiet &
          gcloud beta run worker-pools deploy echo-preview-worker --project $PROJECT --region $REGION \
            --image $REGISTRY/worker:$TAG \
            --service-account echo-preview-worker@$PROJECT.iam.gserviceaccount.com \
            --add-cloudsql-instances $SQL \
            --set-secrets DATABASE_URL=echo-preview-database-url:latest,FILES_S3_ACCESS_KEY_ID=echo-preview-s3-access-key-id:latest,FILES_S3_SECRET_ACCESS_KEY=echo-preview-s3-secret-access-key:latest,$AUDIO_KEYS \
            --set-env-vars APP_ENV=preview,APP_RELEASE=$TAG,FILES_S3_ENDPOINT=https://storage.googleapis.com,FILES_S3_BUCKET=dembrane-echo-echo-preview-uploads,$AUDIO_BUCKET,MEDIA_URL=$MEDIA_URL \
            --cpu 1 --memory 512Mi --instances 1 --quiet &
          for role in dashboard portal; do
            gcloud run deploy echo-preview-$role --project $PROJECT --region $REGION \
              --image $REGISTRY/web:$TAG \
              --service-account echo-preview-web@$PROJECT.iam.gserviceaccount.com \
              --set-env-vars APP_ENV=preview,APP_RELEASE=$TAG,WEB_ROLE=$role \
              --cpu 1 --memory 256Mi --concurrency 200 --min-instances 0 --max-instances 3 \
              --allow-unauthenticated --quiet &
          done
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done; exit $fail
      - name: Live smoke test
        run: |
          url=$(gcloud run services describe echo-preview-api --project $PROJECT --region $REGION --format 'value(status.url)')
          curl -sf "$url/ready"
          release=$(curl -sf "$url/health" | jq -r .release)
          test "$release" = "$TAG" || { echo "serving $release, expected $TAG"; exit 1; }
          # Media refuses callers without an invoker identity.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$MEDIA_URL/health")
          test "$code" = 403 || { echo "media answered $code without a token, expected 403"; exit 1; }
          for role in dashboard portal; do
            web=$(gcloud run services describe echo-preview-$role --project $PROJECT --region $REGION --format 'value(status.url)')
            curl -sf "$web/runtime-config.js" | grep -q "\"role\":\"$role\""
            code=$(curl -s -o /dev/null -w '%{http_code}' "$web/api/v2/me")
            test "$code" = 401 || { echo "$role /api proxy answered $code, expected 401"; exit 1; }
          done
